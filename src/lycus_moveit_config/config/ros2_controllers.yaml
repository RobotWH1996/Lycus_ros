# ros2_control controllers for Lycus
controller_manager:
  ros__parameters:
    update_rate: 100

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    both_arms_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - AR5-5_08L-W4C1C5-ZY2_joint_1
      - AR5-5_08L-W4C1C5-ZY2_joint_2
      - AR5-5_08L-W4C1C5-ZY2_joint_3
      - AR5-5_08L-W4C1C5-ZY2_joint_4
      - AR5-5_08L-W4C1C5-ZY2_joint_5
      - AR5-5_08L-W4C1C5-ZY2_joint_6
      - AR5-5_08L-W4C1C5-ZY2_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - AR5-5_08R-W4C1C5-ZY2_joint_1
      - AR5-5_08R-W4C1C5-ZY2_joint_2
      - AR5-5_08R-W4C1C5-ZY2_joint_3
      - AR5-5_08R-W4C1C5-ZY2_joint_4
      - AR5-5_08R-W4C1C5-ZY2_joint_5
      - AR5-5_08R-W4C1C5-ZY2_joint_6
      - AR5-5_08R-W4C1C5-ZY2_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
both_arms_controller:
  ros__parameters:
    joints:
      - AR5-5_08L-W4C1C5-ZY2_joint_1
      - AR5-5_08L-W4C1C5-ZY2_joint_2
      - AR5-5_08L-W4C1C5-ZY2_joint_3
      - AR5-5_08L-W4C1C5-ZY2_joint_4
      - AR5-5_08L-W4C1C5-ZY2_joint_5
      - AR5-5_08L-W4C1C5-ZY2_joint_6
      - AR5-5_08L-W4C1C5-ZY2_joint_7
      - AR5-5_08R-W4C1C5-ZY2_joint_1
      - AR5-5_08R-W4C1C5-ZY2_joint_2
      - AR5-5_08R-W4C1C5-ZY2_joint_3
      - AR5-5_08R-W4C1C5-ZY2_joint_4
      - AR5-5_08R-W4C1C5-ZY2_joint_5
      - AR5-5_08R-W4C1C5-ZY2_joint_6
      - AR5-5_08R-W4C1C5-ZY2_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
torso_controller:
  ros__parameters:
    joints:
      - Calf_joint
      - Thigh_joint
      - Waist_joint
      - Chest_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
head_controller:
  ros__parameters:
    joints:
      - Neck_joint
      - Head_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
