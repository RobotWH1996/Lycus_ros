    action_ns: follow_joint_trajectory
    default: false
  torso_controller:
    type: FollowJointTrajectory
    joints:
      - Calf-joint
      - Thigh-joint
      - Waist-joint
      - Chest-joint
    action_ns: follow_joint_trajectory
    default: true
  head_controller:
    type: FollowJointTrajectory
    joints:
      - Neck-joint
      - Head-joint
